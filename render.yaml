services:
  - type: web
    name: mathemlearning-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mathemlearning-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
        value: https://<your-vercel-app>.vercel.app

databases:
  - name: mathemlearning-db
    plan: free
    databaseName: mathemlearning
    user: mathemlearning
